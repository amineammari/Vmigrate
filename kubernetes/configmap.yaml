apiVersion: v1
kind: ConfigMap
metadata:
  name: vmigrate-config
  namespace: vmigrate
  labels:
    app.kubernetes.io/name: vmigrate
    app.kubernetes.io/part-of: vmigrate
data:
  DEBUG: "false"
  ALLOWED_HOSTS: "vmigrate.local,localhost,127.0.0.1,backend,vmigrate-backend,database,mariadb,redis,vmigrate-redis"
  DB_NAME: "vm_migrator"
  DB_CONN_MAX_AGE: "600"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/1"
  CELERY_WORKER_CONCURRENCY: "1"
  CELERY_WORKER_PREFETCH_MULTIPLIER: "1"
  CELERY_WORKER_MAX_TASKS_PER_CHILD: "5"
  CELERY_BROKER_POOL_LIMIT: "10"
  CELERY_TASK_SOFT_TIME_LIMIT: "7200"
  CELERY_TASK_TIME_LIMIT: "7500"
  CELERY_TASK_DEFAULT_RETRY_DELAY: "30"
  CELERY_PUBLISH_MAX_RETRIES: "3"
  DEFAULT_SUPERADMIN_USERNAME: "superadmin"
  DEFAULT_SUPERADMIN_EMAIL: "admin@company.internal"
  SESSION_INACTIVITY_TIMEOUT_SECONDS: "7200"
  TIME_ZONE: "UTC"
  LOG_LEVEL: "INFO"
  LOG_DIR: "/app/logs"
  APP_LOG_MAX_BYTES: "10485760"
  APP_LOG_BACKUP_COUNT: "5"
  WORKER_LOG_MAX_BYTES: "20971520"
  WORKER_LOG_BACKUP_COUNT: "7"
  MIGRATION_OUTPUT_DIR: "/var/lib/vm-migrator/images"
  NFS_ENABLED: "false"
  NFS_PATH: "/var/lib/vm-migrator/images"
  NFS_VALIDATE_MOUNT: "false"
  ENABLE_REAL_CONVERSION: "true"
  ENABLE_ANSIBLE_CONVERSION: "false"
  ENABLE_ROLLBACK: "false"
  ENABLE_ESXI_MIGRATION_SNAPSHOT: "false"
  ENABLE_OPENSTACK_DEPLOYMENT: "true"
  ENABLE_TERRAFORM_INFRA: "true"
  ENABLE_TERRAFORM_FROM_CELERY: "true"
  ENABLE_PERIODIC_DISCOVERY: "true"
  DISCOVERY_INTERVAL_SECONDS: "300"
  DISCOVERY_INCLUDE_WORKSTATION: "true"
  DISCOVERY_INCLUDE_ESXI: "true"
  VMWARE_WORKSTATION_PATHS: "/app/images/vmware"
  VMWARE_ESXI_HOST: "esxi.example.internal"
  VMWARE_ESXI_PORT: "443"
  VMWARE_ESXI_INSECURE: "true"
  VMWARE_ESXI_CONVERSION_TRANSPORT: "vddk"
  VMWARE_VDDK_LIBDIR: "/opt/vmware-vddk"
  VMWARE_VDDK_CONFIG: "/opt/vmware-vddk/lib64"
  VMWARE_VDDK_NBDKIT_PLUGIN_PATH: "/usr/lib/x86_64-linux-gnu/nbdkit/plugins"
  VMWARE_NBDKIT_BIN: "/usr/bin/nbdkit"
  VMWARE_NBDKIT_FILTER_PATH: "/usr/lib/x86_64-linux-gnu/nbdkit/filters"
  VIRT_V2V_TIMEOUT_SECONDS: "7200"
  VIRT_V2V_DEBUG: "true"
  VIRT_V2V_NBDKIT_THREADS: "1"
  CONVERSION_LOG_TRUNCATE_BYTES: "0"
  SKIP_CONVERSION_PREFLIGHT: "false"
  PREFLIGHT_STRICT: "false"
  REQUIRE_PREFLIGHT_CONNECTIVITY: "false"
  LIBGUESTFS_BACKEND: "direct"
  LIBGUESTFS_BACKEND_SETTINGS: "force_tcg"
  LIBGUESTFS_MEMSIZE: "768"
  LIBGUESTFS_CPUS: "1"
  LIBGUESTFS_TOOLS_CONF: "/etc/libguestfs-tools.conf"
  LIBGUESTFS_HV: "/usr/local/bin/qemu-system-x86_64-tcg"
  SUPERMIN_KERNEL: "/usr/lib/vm-migrator/kernels/vmlinuz"
  EMBEDDED_KERNEL_ROOT: "/usr/lib/vm-migrator/kernels"
  VMDK_DOWNLOAD_TIMEOUT: "7200"
  ENABLE_ARTIFACT_BACKUP: "true"
  ARTIFACT_BACKUP_DIR: "/var/lib/vm-migrator/images/backups"
  ARTIFACT_BACKUP_REQUIRED: "true"
  ENABLE_GUEST_NETWORK_REMEDIATION: "true"
  GUEST_NETWORK_REMEDIATION_TIMEOUT_SECONDS: "300"
  GUEST_NETWORK_DISABLE_CLOUD_INIT_NETWORK_CONFIG: "false"
  MIGRATION_FAIL_ON_UNSUPPORTED_OS: "false"
  VMWARE_REQUIRE_NO_SNAPSHOTS: "true"
  OPENSTACK_CLOUD_NAME: "openstack"
  OPENSTACK_DEFAULT_NETWORK: "private"
  OPENSTACK_DEFAULT_EXTERNAL_NETWORK: ""
  OPENSTACK_IMAGE_ENDPOINT_OVERRIDE: ""
  OPENSTACK_VERIFY_TIMEOUT: "900"
  OPENSTACK_VERIFY_POLL_INTERVAL: "10"
  OPENSTACK_IMAGE_UPLOAD_TIMEOUT: "1800"
  OPENSTACK_IMAGE_UPLOAD_POLL_INTERVAL: "5"
  OPENSTACK_API_RETRIES: "5"
  OPENSTACK_API_RETRY_DELAY: "5"
  OPENSTACK_ENSURE_BASELINE_ACCESS_SECURITY_GROUP: "true"
  OPENSTACK_BASELINE_ACCESS_SECURITY_GROUP_NAME: "vm-migrator-access"
  OPENSTACK_BASELINE_ACCESS_SECURITY_GROUP_DESCRIPTION: "Baseline ingress/egress rules for migrated VMs."
  OS_AUTH_TYPE: "password"
  OS_AUTH_URL: "http://openstack.example.internal/identity"
  OS_PROJECT_NAME: "admin"
  OS_USER_DOMAIN_NAME: "Default"
  OS_PROJECT_DOMAIN_NAME: "Default"
  OS_IDENTITY_API_VERSION: "3"
  OS_INTERFACE: "public"
  OS_REGION_NAME: "RegionOne"
  OS_VERIFY: "false"
  ANSIBLE_PLAYBOOK_PATH: "/app/ansible/playbooks/conversion.yml"
  ANSIBLE_INVENTORY_PATH: "/app/ansible/inventory/hosts.ini"
  ANSIBLE_BIN: "ansible-playbook"
  ANSIBLE_TIMEOUT_SECONDS: "7200"
  ANSIBLE_LIMIT: ""
  TERRAFORM_BIN: "terraform"
  TERRAFORM_WORKING_DIR: "/app/terraform"
  TERRAFORM_TIMEOUT_SECONDS: "1800"
  VITE_API_BASE_URL: ""
  VITE_PROXY_TARGET: ""
