apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: vmigrate
  labels:
    app.kubernetes.io/name: celery-worker
    app.kubernetes.io/part-of: vmigrate
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: celery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celery-worker
        app.kubernetes.io/part-of: vmigrate
    spec:
      restartPolicy: Always
      securityContext:
        seccompProfile:
          type: Unconfined
      containers:
        - name: celery-worker
          image: vm-migrator/conversion-worker:offline
          imagePullPolicy: Never
          command:
            - /usr/local/bin/conversion-worker-entrypoint
          args:
            - celery
            - -A
            - core
            - worker
            - -l
            - INFO
            - -Q
            - migrations,discovery,provisioning,celery
            - --hostname
            - conversion@%h
          envFrom:
            - configMapRef:
                name: vmigrate-config
            - secretRef:
                name: vmigrate-secrets
          env:
            - name: LD_LIBRARY_PATH
              value: /opt/vmware-vddk/lib64
            - name: LD_PRELOAD
              value: /usr/lib/x86_64-linux-gnu/libstdc++.so.6:/lib/x86_64-linux-gnu/libgcc_s.so.1
          volumeMounts:
            - name: artifacts
              mountPath: /var/lib/vm-migrator/images
            - name: celery-logs
              mountPath: /app/logs
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/conversion-worker-healthcheck
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/conversion-worker-healthcheck
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          securityContext:
            privileged: true
            runAsUser: 0
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - SYS_ADMIN
                - NET_ADMIN
                - SYS_PTRACE
                - DAC_READ_SEARCH
                - MKNOD
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: vmigrate-artifacts
        - name: celery-logs
          emptyDir: {}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: vmigrate
  labels:
    app.kubernetes.io/name: celery-beat
    app.kubernetes.io/part-of: vmigrate
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: celery-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celery-beat
        app.kubernetes.io/part-of: vmigrate
    spec:
      restartPolicy: Always
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: celery-beat
          image: vm-migrator/backend:offline
          imagePullPolicy: Never
          command:
            - /usr/local/bin/celery-beat-entrypoint
          envFrom:
            - configMapRef:
                name: vmigrate-config
            - secretRef:
                name: vmigrate-secrets
          volumeMounts:
            - name: celery-logs
              mountPath: /app/logs
            - name: beat-schedule
              mountPath: /var/lib/vm-migrator/beat
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - test -f /var/lib/vm-migrator/beat/celerybeat-schedule
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pgrep -f "celery.*beat" >/dev/null
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: celery-logs
          emptyDir: {}
        - name: beat-schedule
          emptyDir: {}
