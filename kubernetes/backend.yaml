apiVersion: v1
kind: PersistentVolume
metadata:
  name: vmigrate-artifacts-pv
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: vmigrate
spec:
  capacity:
    storage: 500Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  hostPath:
    path: "/mnt/nfs_test/vmigrate-artifacts"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vmigrate-artifacts
  namespace: vmigrate
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: vmigrate
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
  storageClassName: standard
  volumeName: vmigrate-artifacts-pv
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: vmigrate
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: vmigrate
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: vmigrate
    spec:
      restartPolicy: Always
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: vm-migrator/backend:offline
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: vmigrate-config
            - secretRef:
                name: vmigrate-secrets
          env:
            - name: BACKEND_HEALTHCHECK_URL
              value: http://127.0.0.1:8000/admin/login/
          volumeMounts:
            - name: staticfiles
              mountPath: /app/staticfiles
            - name: backend-logs
              mountPath: /app/logs
            - name: artifacts
              mountPath: /var/lib/vm-migrator/images
          readinessProbe:
            httpGet:
              path: /admin/login/
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /admin/login/
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: staticfiles
          emptyDir: {}
        - name: backend-logs
          emptyDir: {}
        - name: artifacts
          persistentVolumeClaim:
            claimName: vmigrate-artifacts
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: vmigrate
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: vmigrate
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
