apiVersion: v1
kind: Secret
metadata:
  name: vmigrate-secrets
  namespace: vmigrate
  labels:
    app.kubernetes.io/name: vmigrate
    app.kubernetes.io/part-of: vmigrate
type: Opaque
stringData:
  SECRET_KEY: "CHANGE_ME_generate_a_long_random_django_secret_key"
  JWT_SECRET: "CHANGE_ME_generate_a_long_random_jwt_secret"
  DB_USER: "CHANGE_ME_database_user"
  DB_PASSWORD: "CHANGE_ME_database_password"
  DB_ROOT_PASSWORD: "CHANGE_ME_mariadb_root_password"
  DATABASE_URL: "mysql://CHANGE_ME_database_user:CHANGE_ME_database_password@database:3306/vm_migrator?charset=utf8mb4"
  DEFAULT_SUPERADMIN_PASSWORD: "CHANGE_ME_initial_admin_password"
  VMWARE_ESXI_USERNAME: "CHANGE_ME_esxi_username"
  VMWARE_ESXI_PASSWORD: "CHANGE_ME_esxi_password"
  VMWARE_VDDK_THUMBPRINT: "CHANGE_ME_vddk_thumbprint"
  OS_USERNAME: "CHANGE_ME_openstack_username"
  OS_PASSWORD: "CHANGE_ME_openstack_password"
  TERRAFORM_DEFAULT_VARS_JSON: '{"auth_url":"http://openstack.example.internal/identity","username":"CHANGE_ME","password":"CHANGE_ME","project_name":"admin","domain_name":"Default","region":"RegionOne","external_network_id":"CHANGE_ME"}'

